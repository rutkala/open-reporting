version: 2

models:
  - name: stg_nbp
    description: >
      Staging: raw.nbp_exchange_rates joined to nbp_series seed.
      Outputs conformed schema (source_id, domain_id, detail_id, geo, period, period_date, value, obs_status).
      Grain: one row per (detail_id, period_date).
    columns:
      - name: source_id
        tests: [not_null]
      - name: detail_id
        tests: [not_null]
      - name: period_date
        tests: [not_null]
      - name: value
        tests: [not_null]

  - name: fin_indicators
    description: >
      Finance domain indicators — filtered view of all_indicators where domain_id = 'FIN'.
      Currently contains NBP exchange rates (EUR, USD, GBP, CHF vs PLN), daily grain.
