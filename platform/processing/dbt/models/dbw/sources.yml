version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: dbw_observations
        description: >
          Raw GUS DBW HVD observations. One row per variable x section x year x period
          x dimension combination. Ingested via products/ingestion/to_raw/dbw_observations.py.
      - name: dbw_positions
        description: >
          Dimension label lookup. Resolves integer position IDs to human-readable labels.
          Grain: one row per (section_id, dim_id, position_id).
      - name: dbw_variables
        description: >
          Variable metadata. 85 rows — variable_id to variable_name, section_id, category.
