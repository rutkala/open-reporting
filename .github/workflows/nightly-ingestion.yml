name: Nightly Ingestion Pipeline

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the ingestion daemon
        run: python products/ingestion/orchestrator.py

      - name: Run the UI generator
        run: python infra/scheduler/generate_catalog.py

      - name: Commit changes to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/warehouse.duckdb infra/nginx/html/
          git diff --staged --quiet || git commit -m "Automated nightly update"
          git push
