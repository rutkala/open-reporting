services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reporting}
      POSTGRES_USER: ${POSTGRES_USER:-reporting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reporting}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/letsencrypt:ro
      - ./infra/nginx/www:/var/www/certbot:ro
      - ./infra/nginx/html:/usr/share/nginx/charts:ro

  ghost:
    image: ghost:5-alpine
    restart: unless-stopped
    environment:
      url: https://www.open-reporting.dev
      title: Otwarte Raporty
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
      mail__transport: sendmail
    volumes:
      - ghost_data:/var/lib/ghost/content

  agora:
    image: python:3.12-alpine
    restart: unless-stopped
    working_dir: /app
    command: python /app/server.py
    expose:
      - "8800"
    volumes:
      - ./infra/agora:/app:ro
      - ./data/agora:/data

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot

volumes:
  postgres_data:
  ghost_data:
