<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Reporting — Ingestion Plan</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: #1e1e2e; color: #cdd6f4; min-height: 100vh; }
    header { background: #181825; border-bottom: 1px solid #313244; padding: 18px 32px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; font-weight: 700; color: #cba6f7; }
    header a { color: #585b70; text-decoration: none; font-size: 13px; }
    header a:hover { color: #cdd6f4; }
    main { max-width: 1280px; margin: 0 auto; padding: 32px 24px; }

    /* Summary strip */
    .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 32px; }
    .stat-card { background: #181825; border: 1px solid #313244; border-radius: 10px; padding: 16px 22px; flex: 1; min-width: 160px; }
    .stat-card .val { font-size: 26px; font-weight: 700; color: #89b4fa; }
    .stat-card .lbl { font-size: 12px; color: #585b70; margin-top: 4px; text-transform: uppercase; letter-spacing: .04em; }

    /* Section headings */
    h2 { font-size: 16px; font-weight: 600; color: #cba6f7; margin-bottom: 16px; margin-top: 32px; }
    h2:first-of-type { margin-top: 0; }
    h3 { font-size: 14px; font-weight: 600; color: #89b4fa; margin-bottom: 12px; margin-top: 24px; }

    /* API capacity cards */
    .api-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(580px, 1fr)); gap: 20px; }
    .api-card { background: #181825; border: 1px solid #313244; border-radius: 12px; padding: 20px 24px; }
    .api-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .api-name { font-size: 15px; font-weight: 600; color: #cdd6f4; }
    .api-meta { font-size: 12px; color: #585b70; margin-top: 3px; }
    .budget-bar-wrap { background: #313244; border-radius: 6px; height: 10px; margin-bottom: 8px; overflow: hidden; }
    .budget-bar { height: 100%; border-radius: 6px; transition: width .4s; }
    .budget-label { display: flex; justify-content: space-between; font-size: 12px; color: #7f849c; margin-bottom: 14px; }
    .state-line { font-size: 13px; padding: 8px 12px; border-radius: 8px; margin-bottom: 14px;
                  background: rgba(137,180,250,.08); border: 1px solid #313244; color: #cdd6f4; }
    .state-line.paused { background: rgba(249,226,175,.08); color: #f9e2af; }
    .state-line.ok { background: rgba(166,227,161,.08); color: #a6e3a1; }
    .state-line.error { background: rgba(243,139,168,.10); color: #f38ba8; }
    .state-line .state-meta { color: #585b70; font-size: 11px; margin-top: 3px; }
    .tier-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .tier { background: #24273a; border: 1px solid #313244; border-radius: 8px; padding: 6px 10px; font-size: 11px; color: #7f849c; }
    .tier b { color: #cdd6f4; font-weight: 600; display: block; font-size: 12px; }
    .tier .t-note { color: #585b70; }
    .cap-row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
    .cap-item { }
    .cap-item .c-val { font-size: 20px; font-weight: 700; color: #a6e3a1; }
    .cap-item .c-lbl { font-size: 11px; color: #585b70; text-transform: uppercase; letter-spacing: .04em; }
    .cap-item.warn .c-val { color: #f9e2af; }
    .cap-item.low .c-val { color: #f38ba8; }

    /* Subject table */
    .subj-table-wrap { overflow-x: auto; }
    .subj-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .subj-table th { background: #24273a; color: #7f849c; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; padding: 8px 12px; text-align: left; position: sticky; top: 0; }
    .subj-table td { padding: 8px 12px; border-bottom: 1px solid #313244; }
    .subj-table tr:last-child td { border-bottom: none; }
    .subj-table tr:hover td { background: rgba(255,255,255,.03); }
    .prog-bar-wrap { background: #313244; border-radius: 4px; height: 6px; min-width: 80px; overflow: hidden; }
    .prog-bar { height: 100%; border-radius: 4px; }

    /* Schedule table */
    .sched-table-wrap { overflow-x: auto; }
    .sched-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .sched-table th { background: #24273a; color: #7f849c; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; padding: 10px 14px; text-align: left; cursor: pointer; user-select: none; }
    .sched-table th:hover { color: #cdd6f4; }
    .sched-table td { padding: 10px 14px; border-bottom: 1px solid #313244; }
    .sched-table tr:last-child td { border-bottom: none; }
    .sched-table tr:hover td { background: rgba(255,255,255,.03); }
    .source-key { font-family: 'Fira Mono', monospace; font-size: 12px; color: #89dceb; }
    .mode { display:inline-block; padding:2px 7px; border-radius:4px; font-size:11px; font-weight:600; white-space:nowrap; }
    .mode-bulk { background:rgba(137,180,250,.18); color:#89b4fa; }
    .mode-incr { background:rgba(203,166,247,.18); color:#cba6f7; }
    .mode-both { background:rgba(166,227,161,.18); color:#a6e3a1; }
    .mode-api  { background:rgba(148,226,213,.18); color:#94e2d5; }
    .mode-none { background:rgba(108,112,134,.15); color:#6c7086; }
    .badge-complete{background:rgba(166,227,161,.18);color:#a6e3a1;} .badge-partial{background:rgba(249,226,175,.18);color:#f9e2af;}
    .badge-blocked{background:rgba(243,139,168,.18);color:#f38ba8;} .badge-not_started{background:rgba(108,112,134,.18);color:#a6adc8;}
    .badge-skipped{background:rgba(108,112,134,.12);color:#6c7086;text-decoration:line-through;}
    tr.cat-row td { padding:20px 12px 7px; font-size:12px; font-weight:700; color:#cba6f7; text-transform:uppercase; letter-spacing:.06em; border-bottom:2px solid #313244; }
    tr.cat-row .ch { font-weight:400; text-transform:none; letter-spacing:0; color:#585b70; margin-left:10px; }

    /* Badges */
    .badge { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .badge-nightly { background: rgba(166,227,161,.15); color: #a6e3a1; }
    .badge-weekly  { background: rgba(137,180,250,.15); color: #89b4fa; }
    .badge-monthly { background: rgba(203,166,247,.15); color: #cba6f7; }
    .badge-manual  { background: rgba(127,132,156,.15); color: #7f849c; }
    .badge-complete     { background: rgba(166,227,161,.15); color: #a6e3a1; }
    .badge-partial      { background: rgba(249,226,175,.15); color: #f9e2af; }
    .badge-in_progress  { background: rgba(137,180,250,.15); color: #89b4fa; }
    .badge-pending      { background: rgba(127,132,156,.15); color: #7f849c; }
    .badge-blocked      { background: rgba(243,139,168,.15); color: #f38ba8; }
    .badge-failed_partial { background: rgba(250,179,135,.15); color: #fab387; }

    /* Filters */
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
    .filters input { background: #181825; border: 1px solid #313244; color: #cdd6f4; padding: 7px 12px; border-radius: 8px; font-size: 13px; outline: none; width: 200px; }
    .filters input::placeholder { color: #585b70; }
    .filters input:focus { border-color: #89b4fa; }
    .filters select { background: #181825; border: 1px solid #313244; color: #cdd6f4; padding: 7px 12px; border-radius: 8px; font-size: 13px; outline: none; cursor: pointer; }
    .filters select:focus { border-color: #89b4fa; }
    .ts { font-size: 11px; color: #585b70; }

    .no-data { color: #585b70; font-style: italic; font-size: 13px; padding: 24px 0; }
  </style>
</head>
<body>
<header>
  <h1>Ingestion Plan</h1>
  <div style="display:flex;gap:24px;align-items:center;">
    <span id="ts" class="ts"></span>
    <a href="/admin.html">← Admin</a>
  </div>
</header>
<main>
  <div class="stats" id="stats"></div>

  <h2>API Capacity</h2>
  <div class="api-grid" id="api-capacity"></div>

  <h2>Master Ingestion Tracker — all sources</h2>
  <p style="color:#7f849c;font-size:13px;margin:-8px 0 16px">Every source across the four categories: ingestion mode, when it runs, current status and volume. Grouped by category.</p>
  <div class="filters">
    <input type="text" id="search" placeholder="Filter by source key…">
    <select id="cat-filter">
      <option value="">All categories</option>
      <option value="a_pl_gov_central">a — PL gov, combined (GUS)</option>
      <option value="b_pl_gov_institutional">b — PL gov, institutional</option>
      <option value="c_pl_private">c — Commercial & market platforms</option>
      <option value="d_international">d — International</option>
      <option value="e_state_companies">e — State-owned companies</option>
      <option value="f_financial_statements">f — Financial statements</option>
    </select>
    <select id="mode-filter">
      <option value="">All modes</option>
      <option value="bulk">bulk</option>
      <option value="incremental">incremental</option>
      <option value="bulk+incremental">bulk + incremental</option>
      <option value="api_full">API (full)</option>
      <option value="none">none</option>
    </select>
    <select id="status-filter">
      <option value="">All statuses</option>
      <option value="complete">complete</option>
      <option value="partial">partial</option>
      <option value="blocked">blocked</option>
      <option value="not_started">not_started</option>
      <option value="skipped">skipped</option>
    </select>
  </div>
  <div class="sched-table-wrap">
    <table class="sched-table" id="master-table">
      <thead>
        <tr>
          <th>Source</th>
          <th>Mode</th>
          <th>Schedule</th>
          <th>Status</th>
          <th>Files / volume</th>
          <th>Last ingested</th>
        </tr>
      </thead>
      <tbody id="master-body"></tbody>
    </table>
  </div>
</main>

<script>
const PLAN_URL = '/data/ingestion_plan.json';
const CAP_URL  = '/data/ingestion_capacity.json';
const REG_URL  = '/data/source_registry.json';

const CATS = {
  'a_pl_gov_central':       'a — Polish government, combined (GUS)',
  'b_pl_gov_institutional': 'b — Polish government, institutional',
  'c_pl_private':           'c — Commercial & market-data platforms',
  'd_international':         'd — International, combined',
  'e_state_companies':      'e — State-owned companies (spółki Skarbu Państwa)',
  'f_financial_statements': 'f — Financial-statement filings',
};
const MODES = {
  'bulk': ['bulk','mode-bulk'], 'incremental': ['incremental','mode-incr'],
  'bulk+incremental': ['bulk + incr','mode-both'], 'api_full': ['API (full)','mode-api'],
  'none': ['—','mode-none'],
};
function modeChip(m) { const x = MODES[m]||MODES['none']; return `<span class="mode ${x[1]}">${x[0]}</span>`; }
function statusBadge(s) { return `<span class="badge badge-${s||'unknown'}">${(s||'unknown').replace('_',' ')}</span>`; }

function badge(val, type) {
  if (!val) return '<span class="ts">—</span>';
  const cls = `badge badge-${val.replace(/[^a-z_]/g,'').toLowerCase()}`;
  return `<span class="${cls}">${val}</span>`;
}

function cadenceBadge(v) {
  const m = {'nightly':'badge-nightly','weekly':'badge-weekly','monthly':'badge-monthly','manual':'badge-manual'};
  const cls = `badge ${m[v]||'badge-manual'}`;
  return `<span class="${cls}">${v||'—'}</span>`;
}

function pct(done, total) {
  if (!total || total === 0) return null;
  return Math.min(100, Math.round(done * 100 / total));
}

function progressBar(done, total, color) {
  const p = pct(done, total);
  if (p === null) return '<span class="ts">unknown</span>';
  return `<div class="prog-bar-wrap" title="${done}/${total}"><div class="prog-bar" style="width:${p}%;background:${color}"></div></div>`;
}

function subjectStatus(s) {
  if (s.status) return s.status;
  if (s.done > 0 && s.done >= (s.total||0)) return 'complete';
  if (s.done > 0) return 'in_progress';
  if (s.failed > 0) return 'blocked';
  return 'pending';
}

async function load() {
  const [planResp, capResp, regResp] = await Promise.all([fetch(PLAN_URL), fetch(CAP_URL), fetch(REG_URL)]);
  const plan = await planResp.json();
  const cap  = await capResp.json();
  const reg  = await regResp.json();

  document.getElementById('ts').textContent = 'Generated: ' + (cap.generated_at || plan.generated_at || '').replace('T',' ').replace('Z',' UTC');

  // Stats — from the full registry (all 44 sources)
  const entries = plan.entries || [];
  const sources = reg.sources || [];
  const sc = reg.status_counts || {};
  const apiSrc = cap.api_sources || [];
  const statsEl = document.getElementById('stats');
  statsEl.innerHTML = `
    <div class="stat-card"><div class="val">${reg.source_count||sources.length}</div><div class="lbl">Total sources</div></div>
    <div class="stat-card"><div class="val" style="color:#a6e3a1">${sc.complete||0}</div><div class="lbl">Complete</div></div>
    <div class="stat-card"><div class="val" style="color:#f9e2af">${sc.partial||0}</div><div class="lbl">In progress</div></div>
    <div class="stat-card"><div class="val" style="color:#f38ba8">${sc.blocked||0}</div><div class="lbl">Blocked</div></div>
    <div class="stat-card"><div class="val" style="color:#585b70">${(sc.not_started||0)}</div><div class="lbl">Not started</div></div>
    <div class="stat-card"><div class="val">${apiSrc.length}</div><div class="lbl">Rate-limited APIs</div></div>
  `;

  // API capacity cards
  const capEl = document.getElementById('api-capacity');
  capEl.innerHTML = apiSrc.map(api => {
    const usedPct = api.budget_per_week ? Math.min(100, Math.round(api.used_this_week * 100 / api.budget_per_week)) : 0;
    const barColor = usedPct > 80 ? '#f38ba8' : usedPct > 50 ? '#f9e2af' : '#a6e3a1';
    const subjects = api.subjects || [];
    const done5 = subjects.filter(s => subjectStatus(s) === 'complete').length;
    const inprog = subjects.filter(s => subjectStatus(s) === 'in_progress').length;
    const pending = subjects.filter(s => subjectStatus(s) === 'pending').length;
    const blocked = subjects.filter(s => subjectStatus(s) === 'blocked').length;

    const subjRows = subjects.map(s => {
      const st = subjectStatus(s);
      const p = pct(s.done, s.total);
      const bar = s.total ? progressBar(s.done, s.total, '#89b4fa') : '<span class="ts">size unknown</span>';
      const estReq = s.est_requests ? s.est_requests.toLocaleString() : '?';
      return `<tr>
        <td style="font-weight:600">${s.id}</td>
        <td>${s.label}</td>
        <td>${bar}</td>
        <td style="color:#7f849c;font-size:12px">${s.done.toLocaleString()}${s.total ? ' / '+s.total.toLocaleString() : ''}</td>
        <td><span class="badge badge-${st}">${st}</span></td>
        <td style="color:#7f849c;font-size:12px">${estReq} req</td>
        <td style="color:#7f849c;font-size:12px">${s.last_updated ? s.last_updated.substring(0,10) : '—'}</td>
      </tr>`;
    }).join('');

    const weeksLabel = api.est_weeks_to_complete != null
      ? `<span class="cap-item ${api.est_weeks_to_complete > 2 ? 'warn' : ''}"><div class="c-val">${api.est_weeks_to_complete.toFixed(1)}w</div><div class="c-lbl">Est. weeks remaining</div></span>`
      : '';
    const confidenceLabel = api.estimate_confidence
      ? `<span class="cap-item"><div class="c-val" style="font-size:14px;color:#7f849c">${api.estimate_confidence}</div><div class="c-lbl">Estimate confidence</div></span>`
      : '';
    const startedLabel = api.vars_started != null
      ? `<span class="cap-item"><div class="c-val" style="color:#89b4fa">${api.vars_started.toLocaleString()}</div><div class="c-lbl">started</div></span>`
      : '';
    const yearsLabel = api.years_done != null
      ? `<span class="cap-item"><div class="c-val" style="color:#89b4fa">${api.years_done.toLocaleString()}${api.years_total_known ? ' / ' + api.years_total_known.toLocaleString() : ''}</div><div class="c-lbl">year-slices pulled</div></span>`
      : '';

    return `<div class="api-card">
      <div class="api-header">
        <div>
          <div class="api-name">${api.name}</div>
          <div class="api-meta">${api.source_key} · Budget: ${(api.budget_per_week||0).toLocaleString()} req/week · Week ${api.iso_week||''}</div>
        </div>
      </div>
      <div class="budget-bar-wrap"><div class="budget-bar" style="width:${usedPct}%;background:${barColor}"></div></div>
      <div class="budget-label">
        <span>${api.used_this_week.toLocaleString()} used this week (${usedPct}%)</span>
        <span>Resets ${api.header_reset ? api.header_reset.substring(0,10) : '?'}</span>
      </div>
      ${api.state_line ? `<div class="state-line ${api.state_line.startsWith('up to date') ? 'ok' : api.state_line.startsWith('stopped') ? 'error' : 'paused'}">
        ${api.state_line}
        ${api.last_run_ended ? `<div class="state-meta">last run ended ${api.last_run_ended.substring(0,16).replace('T',' ')} UTC · ${(api.last_run_requests ?? 0).toLocaleString()} requests · schedule: ${api.schedule_window || '—'}</div>` : ''}
      </div>` : ''}
      ${(api.quota_tiers && api.quota_tiers.length) ? `<div class="tier-row">${api.quota_tiers.map(t =>
        `<span class="tier"><b>${t.label}</b>${t.limit}${t.note ? `<div class="t-note">${t.note}</div>` : ''}</span>`).join('')}</div>` : ''}
      <div class="cap-row">
        <span class="cap-item"><div class="c-val">${api.units_done.toLocaleString()}</div><div class="c-lbl">${api.units_label||'units'} done</div></span>
        <span class="cap-item"><div class="c-val" style="color:#7f849c">${api.units_total_known ? api.units_total_known.toLocaleString() : '?'}</div><div class="c-lbl">total known</div></span>
        ${startedLabel}
        ${yearsLabel}
        ${weeksLabel}
        ${confidenceLabel}
      </div>
      ${subjects.length ? `
      <h3>${api.subjects_label || `${subjects.length} subjects — ${done5} complete · ${inprog} in progress · ${pending} pending · ${blocked} blocked`}</h3>
      <div class="subj-table-wrap">
        <table class="subj-table">
          <thead><tr>
            <th>ID</th><th>Subject</th><th>Progress</th><th>Count</th><th>Status</th><th>Est. req</th><th>Last updated</th>
          </tr></thead>
          <tbody>${subjRows}</tbody>
        </table>
      </div>` : ''}
    </div>`;
  }).join('');

  // Master tracker — join registry (all 44) with schedule cadence/window
  const schedByKey = {};
  entries.forEach(e => { schedByKey[e.source_key] = e; });

  function scheduleCell(src) {
    const e = schedByKey[src.source_key];
    if (src.extraction_status === 'skipped') return '<span class="ts">skipped by design</span>';
    if (src.ingestion_mode === 'none' || !e) {
      if (src.extraction_status === 'blocked') return '<span class="ts">blocked — not scheduled</span>';
      return '<span class="ts">not scheduled</span>';
    }
    const cad = e.cadence ? `<span class="badge badge-${e.cadence==='nightly'?'nightly':e.cadence==='weekly'?'weekly':e.cadence==='monthly'?'monthly':'manual'}" style="background:rgba(137,180,250,.15);color:#89b4fa">${e.cadence}</span>` : '';
    return `${cad} <span style="color:#7f849c;font-size:12px">${e.window||''}</span>`;
  }

  function volumeCell(src) {
    if (src.file_count != null && src.file_count > 0) return `<span style="color:#cdd6f4">${src.file_count.toLocaleString()}</span> <span class="ts">files</span>`;
    if (src.status_detail) return `<span class="ts">${src.status_detail}</span>`;
    return '<span class="ts">—</span>';
  }

  function renderMaster() {
    const q = document.getElementById('search').value.toLowerCase();
    const fcat = document.getElementById('cat-filter').value;
    const fmode = document.getElementById('mode-filter').value;
    const fstat = document.getElementById('status-filter').value;
    let rows = sources.filter(s => {
      if (q && !(s.source_key+' '+(s.name||'')).toLowerCase().includes(q)) return false;
      if (fcat && s.category !== fcat) return false;
      if (fmode && s.ingestion_mode !== fmode) return false;
      if (fstat && s.extraction_status !== fstat) return false;
      return true;
    });
    const SORD = { complete:0, partial:1, blocked:2, not_started:3, skipped:4 };
    rows.sort((a,b) => (a.category||'9').localeCompare(b.category||'9')
      || (SORD[a.extraction_status]??9)-(SORD[b.extraction_status]??9)
      || (a.name||'').localeCompare(b.name||''));

    const tbody = document.getElementById('master-body');
    if (!rows.length) { tbody.innerHTML = '<tr><td colspan="6" class="no-data">No sources match filters.</td></tr>'; return; }
    let html = '', lastCat = null;
    rows.forEach(s => {
      if (s.category !== lastCat) {
        lastCat = s.category;
        html += `<tr class="cat-row"><td colspan="6">${CATS[s.category]||'Uncategorised'}<span class="ch">${rows.filter(r=>r.category===s.category).length} sources</span></td></tr>`;
      }
      html += `<tr>
        <td><span class="source-key">${s.source_key}</span><div style="font-size:12px;color:#cdd6f4">${s.name||''}</div></td>
        <td>${modeChip(s.ingestion_mode)}</td>
        <td>${scheduleCell(s)}</td>
        <td>${statusBadge(s.extraction_status)}</td>
        <td>${volumeCell(s)}</td>
        <td style="color:#7f849c;font-size:12px">${s.last_ingested||'—'}</td>
      </tr>`;
    });
    tbody.innerHTML = html;
  }

  ['search','cat-filter','mode-filter','status-filter'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', renderMaster);
    el.addEventListener('change', renderMaster);
  });
  renderMaster();
}

load().catch(e => { document.querySelector('main').innerHTML = `<p style="color:#f38ba8;padding:40px">Failed to load: ${e.message}</p>`; });
</script>
</body>
</html>
