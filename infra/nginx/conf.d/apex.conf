server {
    listen 80;
    server_name open-reporting.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.open-reporting.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name open-reporting.dev;

    ssl_certificate     /etc/letsencrypt/live/open-reporting.dev-0003/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open-reporting.dev-0003/privkey.pem;

    return 301 https://www.open-reporting.dev$request_uri;
}
