# Temporary capture log for the Google Drive OAuth re-auth code ($arg_code).
log_format gdrive_oauth_code '$time_iso8601 code=$arg_code state=$arg_state error=$arg_error';

server {
    listen 80;
    server_name portal.open-reporting.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name portal.open-reporting.dev;

    ssl_certificate     /etc/letsencrypt/live/open-reporting.dev-0003/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open-reporting.dev-0003/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'HIGH:!aNULL:!MD5';
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/charts;
    index index.html;

    # ── temporary Google Drive OAuth code capture (rclone re-auth) ──
    location = /auth {
        default_type text/html;
        access_log /var/log/nginx/gdrive_oauth.log gdrive_oauth_code;
        return 200 "<!doctype html><html><head><meta charset=utf-8><title>Authorized</title></head><body style=\"font-family:system-ui,sans-serif;padding:3rem;max-width:32rem;margin:auto\"><h2>&#10003; Authorized</h2><p>Google Drive access granted. You can close this tab and return to the chat &mdash; the token will be installed automatically.</p></body></html>";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache chart HTML files for 1 hour
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ── dbr-managed routes — one file per dashboard, written by `dbr run` ──
    include /etc/nginx/conf.d/dbr-routes/*.conf;
}
