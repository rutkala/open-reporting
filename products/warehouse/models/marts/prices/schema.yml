version: 2

models:
  - name: fact_prices_overview
    description: >
      Annual Prices & Inflation fact. Pivots three Eurostat PRC indicators
      (overall HICP inflation rate, food price index, housing/utilities price index)
      into a wide (geo, period_year, period_date) grain. One row per country per year.
      Source: curated.prc_indicators (domain_id = 'PRC').
    columns:
      - name: geo
        description: ISO country/region code (e.g. 'PL').
        tests: [not_null]
      - name: period_year
        description: Calendar year (integer).
        tests: [not_null]
      - name: period_date
        description: December 31 of period_year — MetricFlow time spine key.
        tests: [not_null]
      - name: inflation_rate_pct
        description: >
          HICP overall rate of change, annual average, percent
          (prc_hicp_aind, coicop=CP00, unit=RCH_A_AVG).
      - name: food_hicp_idx
        description: >
          HICP food and non-alcoholic beverages index, 2015=100, annual average
          (prc_hicp_aind, coicop=CP01, unit=INX_A_AVG).
      - name: housing_hicp_idx
        description: >
          HICP housing, water, electricity, gas and other fuels index, 2015=100, annual average
          (prc_hicp_aind, coicop=CP04, unit=INX_A_AVG).
