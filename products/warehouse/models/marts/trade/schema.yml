version: 2

models:
  - name: fact_trade_overview
    description: >
      Annual Trade fact. Pivots three Eurostat TRD indicators
      (goods exports, goods imports, goods trade balance)
      into a wide (geo, period_year, period_date) grain. One row per country per year.
      Source: curated.trd_indicators (domain_id = 'TRD').
    columns:
      - name: geo
        description: ISO country/region code (e.g. 'PL').
        tests: [not_null]
      - name: period_year
        description: Calendar year (integer).
        tests: [not_null]
      - name: period_date
        description: December 31 of period_year — MetricFlow time spine key.
        tests: [not_null]
      - name: exports_goods_mio_eur
        description: >
          Total goods exports, millions of euros
          (ext_lt_intratrd, flow=EXP, partner=WORLD, unit=MIO_EUR).
      - name: imports_goods_mio_eur
        description: >
          Total goods imports, millions of euros
          (ext_lt_intratrd, flow=IMP, partner=WORLD, unit=MIO_EUR).
      - name: trade_balance_mio_eur
        description: >
          Goods trade balance (exports minus imports), millions of euros
          (ext_lt_intratrd, flow=BAL, partner=WORLD, unit=MIO_EUR).
