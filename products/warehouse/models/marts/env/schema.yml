version: 2

models:
  - name: fact_env_overview
    description: >
      Annual Environment & Energy fact. Pivots four Eurostat ENV indicators
      (GHG emissions, renewable energy share, municipal waste, freshwater abstractions)
      into a wide (geo, period_year, period_date) grain. One row per country per year.
      Source: curated.env_indicators (domain_id = 'ENV').
    columns:
      - name: geo
        description: ISO country/region code (e.g. 'PL', 'EU27_2020').
        tests: [not_null]
      - name: period_year
        description: Calendar year (integer).
        tests: [not_null]
      - name: period_date
        description: December 31 of period_year — MetricFlow time spine key.
        tests: [not_null]
      - name: ghg_emissions_mio_t
        description: >
          Total greenhouse gas emissions excluding LULUCF, millions of tonnes CO2 equivalent
          (env_air_gge, airpol=GHG, src_crf=TOTXMEMO, unit=MIO_T).
      - name: renewable_energy_pct
        description: >
          Renewable energy share in gross final energy consumption, percent
          (nrg_ind_ren, nrg_bal=REN, unit=PC).
      - name: waste_kg_hab
        description: >
          Municipal waste generated per inhabitant, kilograms
          (env_wasmun, unit=KG_HAB, wst_oper=GEN).
      - name: water_abstractions_mio_m3
        description: >
          Freshwater abstractions (total), millions of cubic metres
          (env_wat_abs, unit=MIO_M3, wat_proc=ABST, wat_src=FRW).
