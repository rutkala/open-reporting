    landing_folders: [gus_teryt_bulk]
    extractor_kind: bulk_downloader
    extractor_path: products/ingestion/bulk/run_bulk.py
    manifest_kind: null
    docs_url: https://api.stat.gov.pl/Home/BdlApi
