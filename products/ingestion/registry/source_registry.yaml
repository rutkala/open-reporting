    description: >-
      The TERYT-coded register of Polish administrative units as exposed by the
      BDL API — unit ids, names, levels, parent links. Source for dim_geo.
    extraction_logic: >-
      run_bulk.py pages through /units per level and stores raw JSON pages.
      Changes rarely (administrative reform cadence) — manual/monthly refresh
      is enough.
    landing_layout: "gus_teryt_bulk/level{N}_page{M}.json"
    verification: >-
      Compare unit counts per level with
      https://bdl.stat.gov.pl/api/v1/units?level=2&lang=pl (16 voivodeships
