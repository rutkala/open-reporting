version: 2
# Source registry — one entry per external data source system.
# Fields:
#   base_url          — the system's root URL (clickable entry point for review)
#   endpoints         — concrete endpoints/files we actually call
#   scope             — what slice of the source we ingest (and what we skip)
#   description       — what the source is, who publishes it
#   extraction_logic  — how the extractor works, in one paragraph
#   verification      — how to manually check ingested data against the source
sources:
  - source_key: gus_bdl_api
    category: a_pl_gov_central
    ingestion_mode: api_full
    name: "Bank Danych Lokalnych (BDL API)"
    institution: "GUS"
    type: rest_api
    auth: key_required
    rate_limit:
      requests: 50000
      period: week
      burst_note: "docs also list 10/s, 500/15min, 5000/12h — only the weekly cap observed enforced"
    base_url: https://bdl.stat.gov.pl/api/v1/
    endpoints:
      - "GET /subjects — root K-subject list (33 categories)"
      - "GET /subjects/{id} — subject tree walk to P-level leaves"
      - "GET /variables?subject-id={P} — variable list per leaf subject"
      - "GET /data/by-variable/{id}?unit-level=2&year=… — observations"
    scope: >-
      All 33 root subject categories (K1…K54), every variable under them,
      unit-level 2 (województwa) observations for years 2000-2025.
      Powiat/gmina levels (4/5) NOT pulled — would multiply volume ~20x.
    description: >-
      GUS's regional statistics bank — the largest Polish public statistics API.
      ~65,000 variables across labour, population, public finance, prices,
      housing, environment and more, at national/voivodeship/county/commune level.
    extraction_logic: >-
      Resumable mirror via products/ingestion/extractors/bdl_extractor.py:
      walks each K-subject tree to leaves, lists variables, then pulls one JSON
      file per variable (all years, unit-level 2). Manifest checkpoint per
      subject; weekly budget pacing (50k req); cron daily 03:30 UTC, no-ops
      when quota spent.
    landing_layout: "gus_bdl_api/{K-subject}/{variable_id}.json"
    verification: >-
      Pick a variable file, note _meta.variable_id, then compare values at
      https://bdl.stat.gov.pl/bdl/dane/podgrup/temat (search by variable name)
      or GET /data/by-variable/{id}?unit-level=2&lang=pl in a browser.
    landing_folders: [gus_bdl_api]
    extractor_kind: script
    extractor_path: products/ingestion/extractors/bdl_extractor.py
    manifest_kind: bdl
    docs_url: https://api.stat.gov.pl/Home/BdlApi
    default_status: partial

  - source_key: gus_dbw_api
    category: a_pl_gov_central
    ingestion_mode: incremental
    name: "Dziedzinowe Bazy Wiedzy (DBW REST API 1.2.0)"
    institution: "GUS"
    type: rest_api
    auth: key_required
    rate_limit:
      requests: 50000
      period: week
      burst_note: "500 req/15min, 5000 req/12h — per-run cap 4500"
    base_url: https://api-dbw.stat.gov.pl/api/1.2.0/
    endpoints:
      - "GET /variable/variable-section-periods — catalog of valid (variable, przekrój, okres) combos"
      - "GET /variable/variable-meta?id-zmiennej= — year coverage per przekrój"
      - "GET /variable/variable-data-section?id-zmienna=&id-przekroj=&id-rok=&id-okres= — data"
    scope: >-
      All 1,518 variables in the DBW catalog, every przekrój (cross-section)
      and okres (period type), full year range per variable-meta szereg-czasowy.
    description: >-
      GUS Domain Knowledge Bases — curated macroeconomic and social indicators
      (production, prices, labour market, demography) with richer
      dimensionality than BDL: each variable carries cross-sections (przekroje)
      and period types (monthly/quarterly/annual).
    extraction_logic: >-
      Resumable mirror via products/ingestion/extractors/dbw_extractor.py:
      fetches the section-periods catalog once, then per variable reads
      variable-meta for exact year coverage and pulls one JSON per
      (variable, przekrój, year) with all period slices. Manifest v2 checkpoint;
      cron 04:00+16:00 UTC, 4,500 req/run.
    landing_layout: "gus_dbw_api/variables/{variable_id}/{przekroj}_{rok}.json"
    verification: >-
      Take a file's _meta (variable_id, przekroj_id, rok), then browse
      https://dbw.stat.gov.pl/ → find the variable by name (manifest stores
      names) and compare values for that year/przekrój.
    landing_folders: [gus_dbw_api]
    extractor_kind: script
    extractor_path: products/ingestion/extractors/dbw_extractor.py
    manifest_kind: dbw
    docs_url: https://api.stat.gov.pl/Home/DBWApi
    default_status: partial

  - source_key: gus_dbw_hvd_bulk
    category: a_pl_gov_central
    ingestion_mode: bulk
    name: "GUS DBW High-Value Datasets (bulk CSV/XLSX)"
    institution: "GUS"
    type: bulk_download
    auth: none
    rate_limit: null
    base_url: https://dbw.stat.gov.pl/pl/katalog/bulk
    endpoints:
      - "GET dbw.stat.gov.pl/api_app/getCatalogValues — bulk file catalogue"
      - "GET {file}.zip — one zip per dataset, csv_pl + xlsx_pl variants"
    scope: >-
      The full HVD bulk catalogue (~213 datasets × 2 formats = 426 zips):
      GDP, macro aggregates, population, employment — EU High-Value-Dataset
      designated statistics.
    description: >-
      Pre-packaged bulk exports of DBW data designated as EU High-Value
      Datasets. Same id_zmienna/id_przekroj identifiers as the DBW API, but
      delivered as complete CSV dumps with dictionary files (Slowniki).
    extraction_logic: >-
      universal_bulk_downloader.py reads the bulk catalogue and mirrors every
      zip into landing. Overlaps with gus_dbw_api content — kept both because
      bulk is complete-but-monthly while the API is current.
    landing_layout: "gus_dbw_hvd_bulk/{dataset_id}_{csv|xlsx}_pl.zip"
    verification: >-
      Unzip any file: {id}_pl.csv has the data, {id}_Slowniki.csv maps
      dimension ids to labels. Compare with the same dataset at
      https://dbw.stat.gov.pl/pl/katalog/bulk (dataset id in filename).
    landing_folders: [gus_dbw_hvd_bulk]
    extractor_kind: bulk_downloader
    extractor_path: products/ingestion/bulk/run_bulk.py
    manifest_kind: null
    docs_url: https://dbw.stat.gov.pl/pl/katalog/bulk
    default_status: complete

  - source_key: eurostat_bulk
    category: d_international
    ingestion_mode: bulk+incremental
    name: "Eurostat Bulk Download (TSV.GZ)"
    institution: "Eurostat"
    type: bulk_api
    auth: none
    rate_limit: null
    base_url: https://ec.europa.eu/eurostat/api/dissemination/
    endpoints:
      - "GET /catalogue/toc/txt?lang=en — table of contents (dataset list)"
      - "GET /sdmx/2.1/data/{code}/?format=TSV&compressed=true — one file per dataset"
    scope: >-
      EVERY dataset and table in the Eurostat TOC (~7,600 files) — full mirror,
      all EU countries, not filtered to Poland.
    description: >-
      The EU statistical office's complete public database: national accounts,
      labour, prices, demography, trade — comparable across all member states.
      Poland-vs-EU benchmarking comes from here.
    extraction_logic: >-
      universal_bulk_downloader.py walks the TOC and downloads each dataset as
      compressed TSV. Re-running refreshes changed datasets. Nightly
      incremental (run_incremental.py) additionally upserts selected series
      into DuckDB raw.eurostat_observations.
    landing_layout: "eurostat_bulk/{dataset_code}.tsv.gz"
    verification: >-
      Any file's dataset code maps to
      https://ec.europa.eu/eurostat/databrowser/view/{code}/default/table —
      compare values directly in the data browser.
    landing_folders: [eurostat_bulk]
    extractor_kind: bulk_downloader
    extractor_path: products/ingestion/bulk/run_bulk.py
    manifest_kind: null
    docs_url: https://wikis.ec.europa.eu/display/EUROSTATHELP/API+-+Getting+started
    default_status: complete

