    base_url: https://new.stat.gov.pl/biuletyn-statystyczny-dlugie-szeregi
    endpoints:
      - "Scrape of the page's file-url spans — one XLSX per long-series table"
    scope: >-
      All long-series XLSX tables published on the Biuletyn Statystyczny page
      (~64 files): monthly macro indicators back to the 1990s.
    description: >-
      GUS Statistical Bulletin long time series — the canonical monthly macro
      tables (production, prices, wages, employment, trade) in Excel form,
      maintained as continuously-extended series.
    extraction_logic: >-
      run_bulk.py scrapes the page for file links and mirrors every XLSX.
      Files are versioned by GUS in place — re-download overwrites with the
      extended series.
    landing_layout: "gus_biuletyn_bulk/{original_filename}.xlsx"
    verification: >-
      Open the landing XLSX next to the same file downloaded manually from the
      page — names match 1:1.
    landing_folders: [gus_biuletyn_bulk]
    extractor_kind: bulk_downloader
    extractor_path: products/ingestion/bulk/run_bulk.py
    manifest_kind: null
    docs_url: https://new.stat.gov.pl/biuletyn-statystyczny-dlugie-szeregi
    default_status: complete

