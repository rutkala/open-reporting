  - source_key: gus_dbw_api
    cadence: nightly
    window: "04:00 + 16:00 UTC"
    mechanism: "cron: products/ingestion/run_gus_bulk.sh dbw (resumable, 4.5k req/run vs 5k/12h cap)"
    priority: 3
    notes: "API 1.2.0; 1,518 variables; 50k req/week; full mirror ~3 weeks, then incremental"
    quota_tiers:
      - {label: "Burst", limit: "500 req / 15 min", note: "avoided by 1.9s pacing"}
      - {label: "12-hour", limit: "5,000 req / rolling 12h", note: "binding tier — caps effective pace at ~5k/day"}
      - {label: "Weekly", limit: "50,000 req / 7 days"}

