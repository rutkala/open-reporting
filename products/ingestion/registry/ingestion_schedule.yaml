  - source_key: gus_bdl_api
    cadence: nightly
    window: "03:30 UTC"
    mechanism: "cron: products/ingestion/run_gus_bulk.sh bdl (resumable, --subjects all, 7k req/run)"
    priority: 2
    notes: "Budget-paced: 50k req/week; no-ops when weekly quota spent, resumes on ISO-week reset"
    quota_tiers:
      - {label: "Burst", limit: "10 req / s", note: "documented; not observed enforced"}
      - {label: "15-min", limit: "500 req / 15 min", note: "documented; not observed enforced (we ran 2.4x over, no 429)"}
      - {label: "12-hour", limit: "5,000 req / 12h", note: "documented; not observed enforced (36k in one window, no 429)"}
      - {label: "Weekly", limit: "50,000 req / 7 days", note: "ENFORCED — tracked via X-Rate-Limit headers"}
    subject_meta:
      K27: {label: "Finanse publiczne", est_requests: 4599}
      K40: {label: "Wynagrodzenia i świadczenia", est_requests: 593}
      K3:  {label: "Ludność", est_requests: 10119}
      K15: {label: "Ceny", est_requests: 4214}
      K11: {label: "Mieszkalnictwo", est_requests: 1107}
