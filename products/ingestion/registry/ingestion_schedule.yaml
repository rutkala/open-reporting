      K8:  {label: "Transport i łączność", est_requests: null}
      K9:  {label: "Stan i ochrona środowiska", est_requests: null}
      K10: {label: "Nauka i technika", est_requests: null}
      K12: {label: "Przemysł i budownictwo", est_requests: null}
      K13: {label: "Rynek materiałowy i energetyczny", est_requests: null}
      K16: {label: "Handel i gastronomia", est_requests: null}
      K18: {label: "Turystyka", est_requests: null}
      K19: {label: "Wychowanie przedszkolne", est_requests: null}
      K20: {label: "Szkolnictwo", est_requests: null}
      K21: {label: "Szkolnictwo wyższe", est_requests: null}
