# Config for pl_api_extractor.py — simple/hierarchical Polish JSON-REST sources.
# mode: flat (fetch each endpoint, save JSON) | sejm (parliamentary hierarchy)
sources:
  imgw_api:
    mode: flat
    base: https://danepubliczne.imgw.pl/api/data
    endpoints:
      - {path: synop, name: synop}     # synoptic stations (current)
      - {path: hydro, name: hydro}     # hydrological stations
      - {path: meteo, name: meteo}     # meteo stations

  sejm_api:
    mode: sejm
    base: https://api.sejm.gov.pl/sejm
    # Full scope: extractor auto-discovers ALL terms and pulls every collection
    # (MP/clubs/committees/proceedings + paginated interpellations/writtenQuestions/
    # prints/processes) + votings per sitting. No terms/collections limit by design.
    votings: true
