# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Poważna deprywacja materialna — najnowsza wartość z deltą r/r.
# Seria kończy się w 2020 (zmiana metodologii SMD→SMSD); karta KPI rozwiązuje
# najnowszą wartość nie-NULL. ascending_is_good=false: spadek jest pożądany.

type: card
encoding:
  value: { metric: material_deprivation }
filter:
  geo: PL
options:
  delta:
    vs: prior_year
    format: icon-first
