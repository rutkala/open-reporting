# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Zagrożenie ubóstwem — najnowsza wartość z deltą r/r.
# ascending_is_good=false (semantic meta): spadek wskaźnika ubóstwa jest pożądany.

type: card
encoding:
  value: { metric: at_risk_poverty }
filter:
  geo: PL
options:
  delta:
    vs: prior_year
    format: icon-first
