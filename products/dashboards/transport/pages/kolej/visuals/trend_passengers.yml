# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Kolej pasażerska — historia roczna (2004–2025), mln pasażero-km.
# Line chosen: continuous annual aggregates; the COVID collapse in 2020 and the
# subsequent recovery to record highs (2024-2025) are the central story.

type: line
encoding:
  x: { dimension: date_key__cal_year }
  y: { metric: rail_passengers }
filter:
  geo: PL
