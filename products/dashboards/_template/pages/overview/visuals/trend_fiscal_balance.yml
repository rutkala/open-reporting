# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Line chart — fiscal balance per calendar year for Poland.
#
# Star-schema convention: the x-axis dimension comes from dim_calendar
# (joined via the date_key entity on finance_overview), NOT from the
# fact table directly.

type: line
encoding:
  x: { dimension: date_key__cal_year }
  y: { metric: fiscal_balance }
filter:
  geo: PL
