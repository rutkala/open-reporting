# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Dług publiczny brutto i netto wg MFW WEO — historia + prognoza,
# z linią odniesienia na 60% PKB (kryterium z Maastricht).

type: line
encoding:
  x: { dimension: date_key__cal_year }
  y:
    metric:
      - gross_debt_weo
      - net_debt_weo
filter:
  geo: PL
options:
  dash_when:
    dimension: imf__is_projection
    value: true
  reference_lines:
    - { value: 60, label: "Próg Maastricht", color: negative }
