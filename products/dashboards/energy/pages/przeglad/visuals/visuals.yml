# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visuals.schema.json
# Page 1 layout — energy transition snapshot:
#   Row 1: 2 KPI cards (renewable energy share, energy productivity)
#   Row 2: line chart — renewable energy trend 2004-2024 (full width)
#   Row 3: line chart — energy productivity trend 2000-2024 (full width)

rows:
  - title: "Wskaźniki transformacji energetycznej"
    items:
      - { visual: kpi_renewables,         width: "50%" }
      - { visual: kpi_energy_productivity, width: "50%" }
  - title: "Udział energii odnawialnej — historia roczna (2004–2024)"
    items:
      - { visual: trend_renewables, width: "100%" }
  - title: "Produktywność energetyczna — historia roczna (2000–2024)"
    items:
      - { visual: trend_energy_productivity, width: "100%" }
