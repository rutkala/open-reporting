# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Koszty obsługi długu Polski (% PKB) — wzrost od ok. 1.4% (2020) do 2.2% (2024).

type: line
encoding:
  x: { dimension: date_key__cal_year }
  y: { metric: interest_expenditure }
filter:
  geo: PL
options:
  annotations:
    - { x: 2021, y: 1.1, text: "Minimum historyczne", direction: below, color: subtext }
    - { x: 2024, y: 2.2, text: "Podwojenie w 4 lata", direction: above, color: negative }
