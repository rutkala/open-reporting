# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visuals.schema.json
# Page 3 — fixed canvas: one prose lead + a single row of two side-by-side charts
# (debt level + interest cost) that fills the page height.

rows:
  - prose: |
      Dług publiczny wzrósł z ~45% PKB (2019) do **59,7% w 2025 r.**, tuż przy progu
      Maastricht (60%). Towarzyszy temu **podwojenie kosztów obsługi** w cztery lata
      do 2,5% PKB — ok. **40 mld zł rocznie** za każdy 1 punkt procentowy w odsetkach.
    items:
      - { visual: debt_trend,     width: "50%" }
      - { visual: interest_trend, width: "50%" }
