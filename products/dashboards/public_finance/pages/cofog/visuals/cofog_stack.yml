# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Skumulowany wykres słupkowy — wydatki Polski wg 10 funkcji COFOG (% PKB) rok do roku.
# Każdy słupek to suma wszystkich funkcji w danym roku; kolor rozróżnia funkcje.

type: column
encoding:
  x:     { dimension: date_key__cal_year }
  y:     { metric:    cofog_expenditure }
  color: { dimension: cofog_function__cofog_label_pl }
filter:
  geo: PL
options:
  stack: true
