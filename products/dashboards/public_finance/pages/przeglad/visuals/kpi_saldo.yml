# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Saldo finansów publicznych — najnowsza wartość roczna z badge SGP.

type: card
encoding:
  value: { metric: fiscal_balance }
filter:
  geo: PL
options:
  threshold:
    rule: sgp_deficit
  delta:
    vs: prior_year
    format: icon-first
