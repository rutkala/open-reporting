# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Saldo finansów publicznych — pełna historia 1995–2024 z linią SGP -3% i osią równowagi.

type: line
encoding:
  x: { dimension: date_key__cal_year }
  y: { metric: fiscal_balance }
filter:
  geo: PL
options:
  reference_lines:
    - { value: -3, label: "Próg SGP (-3% PKB)", color: negative }
    - { value:  0, label: "Równowaga",          color: subtext }
