# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visuals.schema.json
# Page 2 layout:
#   Row 1: COFOG sorted bar (latest year) — answers "where does money go?"
#   Row 2: trend of top categories (multi-line)

rows:
  - title: "Struktura wydatków w 2023 r."
    prose: |
      **Ochrona socjalna** dominuje strukturę wydatków — blisko 17% PKB —
      wyprzedzając Gospodarkę, Zdrowie i Edukację. Te cztery funkcje
      łącznie pochłaniają ok. 30% PKB.
    items:
      - { visual: cofog_breakdown, width: "100%" }
  - title: "Trend czterech największych funkcji 1995–2023"
    prose: |
      Ochrona socjalna utrzymuje się stabilnie w przedziale 17–18% PKB
      przez cały okres. Skok w funkcji **Gospodarka w 2020 r.** (~5% → ~9%)
      to efekt rządowych tarcz antykryzysowych w czasie pandemii COVID-19.
    items:
      - { visual: cofog_trend,     width: "100%" }
