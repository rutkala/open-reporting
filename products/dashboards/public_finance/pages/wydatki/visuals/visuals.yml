# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visuals.schema.json
# Page 2 — fixed canvas: one prose lead + a single row of two side-by-side charts
# (COFOG structure + COFOG trend) that fills the page height. Each chart self-labels
# via its own title/subtitle.

rows:
  - prose: |
      **Ochrona socjalna** dominuje strukturę wydatków (ponad 18% PKB); cztery
      największe funkcje to ok. 36% PKB. Skok funkcji **Gospodarka w 2020 r.**
      (~5% → ~9%) to efekt rządowych tarcz antykryzysowych w czasie pandemii COVID-19.
    items:
      - { visual: cofog_breakdown, width: "50%" }
      - { visual: cofog_trend,     width: "50%" }
