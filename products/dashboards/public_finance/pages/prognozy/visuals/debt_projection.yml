# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Dług publiczny brutto wg MFW WEO — historia + prognoza, próg Maastricht 60%.

type: line
title:  "Projekcja długu 2024–2030"
subtitle: "% PKB, MFW WEO"
encoding:
  x: { dimension: date_key__cal_year }
  y: { metric: gross_debt_weo }
filter:
  geo: PL
options:
  dash_when:
    dimension: imf__is_projection
    value: true
  reference_lines:
    - { value: 60, label: "Próg Maastricht", color: negative }
  annotations:
    - { x: 2026, y: 62.9, text: "Przekroczenie 60% Maastricht", direction: above, color: negative }
  download: true
