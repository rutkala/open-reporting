# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visuals.schema.json
# Page 5 — fixed canvas: one prose lead + two side-by-side projection charts
# (balance + debt, history solid / IMF forecast dashed) that fill the page height.

rows:
  - prose: |
      Prognoza MFW WEO: saldo fiskalne pozostaje **poniżej progu SGP (-3% PKB)** przez
      cały horyzont, a dług publiczny może **przekroczyć próg Maastricht (60% PKB)
      około 2026–2027 r.** — pierwszy raz od dekady i główne ryzyko fiskalne.
    items:
      - { visual: balance_projection, width: "50%" }
      - { visual: debt_projection,    width: "50%" }
