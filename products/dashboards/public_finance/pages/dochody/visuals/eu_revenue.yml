# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Dochody sektora finansów publicznych UE-27, dwa najnowsze lata side-by-side —
# Polska wyróżniona. Pokazuje, że Polska jest państwem o relatywnie niskich
# dochodach (i obciążeniach podatkowych) na tle UE — daleko od nordyckich >50% PKB.

type: bar
title:  "Dochody publiczne na tle UE"
subtitle: "% PKB, UE-27"
encoding:
  x: { metric: total_revenue }
  y: { dimension: geo__country_name_pl }
filter:
  geo: [AT, BE, BG, CY, CZ, DE, DK, EE, EL, ES, FI, FR, HR, HU, IE, IT, LT, LU, LV, MT, NL, PL, PT, RO, SE, SI, SK]
options:
  dual_year: true
  sort: value-desc
  highlight:
    value: Polska
    color: azure_1
    other: slate_3
  download: true
