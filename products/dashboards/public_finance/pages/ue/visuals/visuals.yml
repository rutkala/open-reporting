# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visuals.schema.json
# Page 4 — prose lead + full-width EU-27 deficit choropleth (geographic pattern),
# then two side-by-side ranked bars (deficit + debt) for precise ranking. Map answers
# "where", bars answer "exactly how much" — Polska highlighted in azure on the bars.

rows:
  - prose: |
      W 2024 r. **Polska przekroczyła próg SGP** (-3% PKB) z deficytem ~-6,5% — drugi
      największy w UE-27 po Rumunii. Dług publiczny (~55% PKB) **mieści się poniżej**
      progu Maastricht (60%), ale przewyższa średnią krajów Europy Środkowo-Wschodniej.
    items:
      - { visual: eu_deficit_map, width: "100%" }
  - items:
      - { visual: eu_deficit, width: "50%" }
      - { visual: eu_debt,    width: "50%" }
