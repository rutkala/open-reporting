# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Dług publiczny brutto UE-27, dwa najnowsze lata side-by-side — Polska wyróżniona.

type: bar
encoding:
  x: { metric: public_debt }
  y: { dimension: geo__country_name_pl }
filter:
  geo: [AT, BE, BG, CY, CZ, DE, DK, EE, EL, ES, FI, FR, HR, HU, IE, IT, LT, LU, LV, MT, NL, PL, PT, RO, SE, SI, SK]
options:
  dual_year: true
  sort: value-desc
  highlight:
    value: Polska
    color: azure_1
    other: slate_3
  reference_lines:
    - { value: 60, label: "Próg Maastricht", color: negative }
  table:
    row_limit: 54
    labels:
      geo__country_name_pl: "Kraj"
      date_key__cal_year: "Rok"
      public_debt: "Dług publiczny (% PKB)"
