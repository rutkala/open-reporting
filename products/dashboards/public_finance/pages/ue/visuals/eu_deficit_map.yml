# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Mapa deficytu fiskalnego UE-27, 2024 — wzorzec geograficzny uzupełnia ranking słupkowy.
# Skala dwukierunkowa wokół zera: czerwień = deficyt, zieleń = nadwyżka.

type: choropleth
title:  "Deficyt fiskalny w UE-27, 2024"
subtitle: "% PKB — czerwień: deficyt, zieleń: nadwyżka"
encoding:
  location: { dimension: geo }
  color:    { metric: fiscal_balance }
filter:
  geo: [AT, BE, BG, CY, CZ, DE, DK, EE, EL, ES, FI, FR, HR, HU, IE, IT, LT, LU, LV, MT, NL, PL, PT, RO, SE, SI, SK]
  date_key__cal_year: 2024
options:
  geojson: europe_countries
  colorscale: RdYlGn
  color_midpoint: 0
  value_format: ",.1f"
  height: 440
