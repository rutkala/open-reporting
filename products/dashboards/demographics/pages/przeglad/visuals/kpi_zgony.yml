# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Współczynnik zgonów — najnowsza wartość z deltą r/r.
# ascending_is_good=false: wyższy wskaźnik zgonów jest niekorzystny.

type: card
encoding:
  value: { metric: death_rate }
filter:
  geo: PL
options:
  delta:
    vs: prior_year
    format: icon-first
