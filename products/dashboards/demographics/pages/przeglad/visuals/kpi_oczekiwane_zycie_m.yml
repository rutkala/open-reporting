# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Oczekiwana długość życia mężczyzn — najnowsza wartość z deltą r/r.
# ascending_is_good=true: dłuższe życie jest korzystne.

type: card
encoding:
  value: { metric: life_expectancy_m }
filter:
  geo: PL
options:
  delta:
    vs: prior_year
    format: icon-first
