# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visuals.schema.json
# Page 3 layout — digitalization:
#   Row 1: 2 KPI cards (internet usage %, digital public services %)
#   Row 2: internet usage trend (full width)
#   Row 3: digital public services trend (full width)

rows:
  - title: "Cyfryzacja Polski — kluczowe wskaźniki"
    items:
      - { visual: kpi_internet,    width: "50%" }
      - { visual: kpi_digital_gov, width: "50%" }
  - title: "Korzystanie z internetu — historia roczna (2004–2025)"
    items:
      - { visual: trend_internet, width: "100%" }
  - title: "Usługi publiczne online — historia roczna (2004–2025)"
    items:
      - { visual: trend_digital_gov, width: "100%" }
