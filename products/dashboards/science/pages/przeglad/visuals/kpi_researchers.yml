# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Liczba badaczy (EPC) — bieżąca wartość z deltą r/r.
# ascending_is_good=true: więcej badaczy = większy potencjał innowacyjny.

type: card
encoding:
  value: { metric: researchers }
filter:
  geo: PL
options:
  delta:
    vs: prior_year
    format: icon-first
