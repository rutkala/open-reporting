# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Zgłoszenia patentowe EPO na mln mieszkańców — bieżąca wartość z deltą r/r.
# ascending_is_good=true: więcej patentów = wyższa komercjalizacja badań.

type: card
encoding:
  value: { metric: patents }
filter:
  geo: PL
options:
  delta:
    vs: prior_year
    format: icon-first
