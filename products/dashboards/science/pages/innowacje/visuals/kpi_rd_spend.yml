# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Nakłady na B+R w mln EUR — bieżąca wartość z deltą r/r.
# ascending_is_good=true: wyższe wydatki = silniejszy ekosystem innowacji.

type: card
encoding:
  value: { metric: rd_total_spend }
filter:
  geo: PL
options:
  delta:
    vs: prior_year
    format: icon-first
