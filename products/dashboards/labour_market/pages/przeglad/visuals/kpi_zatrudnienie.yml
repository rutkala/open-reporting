# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Wskaźnik zatrudnienia 20–64 — najnowsza wartość z badge EU-2030 i delta r/r.
# Cel EU 2030: 78% — threshold rule drives the badge colour.

type: card
encoding:
  value: { metric: employment_rate }
filter:
  geo: PL
options:
  threshold:
    rule: eu2030
  delta:
    vs: prior_year
    format: icon-first
