# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Wskaźnik zatrudnienia 20–64 — pełna historia 2000–2024, Polska.
# Line chosen over bar: continuous annual time series (natural temporal order).

type: line
encoding:
  x: { dimension: date_key__cal_year }
  y: { metric: employment_rate }
filter:
  geo: PL
