# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visuals.schema.json
# Page 1 layout — scoreboard:
#   Row 1: 3 KPI cards (bezrobocie, zatrudnienie, aktywność)
#   Row 2: 2 trend charts side by side (bezrobocie + zatrudnienie 2000–2024)

rows:
  - title: "Trzy kluczowe wskaźniki"
    items:
      - { visual: kpi_bezrobocie,  width: "33%" }
      - { visual: kpi_zatrudnienie, width: "33%" }
      - { visual: kpi_aktywnosc,   width: "33%" }
  - title: "Tendencja 2000–2024"
    items:
      - { visual: trend_bezrobocie, width: "50%" }
      - { visual: trend_zatrudnienie, width: "50%" }
