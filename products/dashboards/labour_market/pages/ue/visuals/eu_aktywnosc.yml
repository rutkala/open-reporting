# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Aktywność zawodowa 15-74 — przekrój UE-27, Polska wyróżniona.

type: bar
encoding:
  x: { metric: activity_rate }
  y: { dimension: geo__country_name_pl }
filter:
  geo: [AT, BE, BG, CY, CZ, DE, DK, EE, EL, ES, FI, FR, HR, HU, IE, IT, LT, LU, LV, MT, NL, PL, PT, RO, SE, SI, SK]
options:
  sort: value-desc
  highlight:
    value: Polska
    color: azure_1
    other: slate_3
  table:
    row_limit: 54
    labels:
      geo__country_name_pl: "Kraj"
      date_key__cal_year: "Rok"
      activity_rate: "Aktywność zawodowa (%)"
