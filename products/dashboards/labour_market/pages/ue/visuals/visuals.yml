# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visuals.schema.json
# Page 4 — fixed canvas: one prose lead + two side-by-side ranked EU-27 bars
# (employment + activity), Polska highlighted. Side-by-side gives each 27-row bar the
# full page height it needs to stay readable, and fits one viewport without clipping.
# Each chart self-labels via title/subtitle; values available via CSV download (no inline
# 27-row table, which would overflow the fixed canvas).

rows:
  - prose: |
      Cel UE 2030 to **wskaźnik zatrudnienia 78%** — Polska już go przekroczyła (78,8%
      w 2025 r., powyżej średniej UE-27) i wyróżnia się na tle Francji, Belgii czy
      Włoch. Pod względem **aktywności zawodowej** (15–74) Polska plasuje się w środku
      stawki UE-27.
    items:
      - { visual: eu_zatrudnienie, width: "50%" }
      - { visual: eu_aktywnosc,    width: "50%" }
