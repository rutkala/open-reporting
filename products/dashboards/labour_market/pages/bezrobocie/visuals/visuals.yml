# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visuals.schema.json
# Page 2 layout — unemployment detail, fixed canvas (two rows, no clip):
#   Row 1: two side-by-side trends — PL vs EU27 overall + youth (15–24)
#   Row 2: EU-27 ranked bar — latest year (full width)
# Side-by-side trends free the vertical space the 27-row EU ranking needs to stay readable.

rows:
  - title: "Stopa bezrobocia — trend (2000–2024)"
    prose: |
      Bezrobocie ogółem w Polsce spadło poniżej średniej UE-27. Bezrobocie młodych
      (15–24) systematycznie maleje od 2013 roku — z ok. 28% do ok. 12%, jeden z
      najdynamiczniejszych spadków w UE-27 w tej dekadzie.
    items:
      - { visual: trend_bezrobocie_eu, width: "50%" }
      - { visual: trend_mlodzi,        width: "50%" }
  - title: "Stopa bezrobocia w UE-27 — najnowszy rok"
    items:
      - { visual: eu_bezrobocie, width: "100%" }
