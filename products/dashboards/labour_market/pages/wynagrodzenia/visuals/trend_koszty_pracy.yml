# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Wzrost kosztów pracy r/r — Polska.
# Reference line at 0: visually separates growth from contraction without relying on colour alone.
# Single series — no legend needed.

type: line
encoding:
  x: { dimension: date_key__cal_year }
  y: { metric: wage_growth }
filter:
  geo: PL
options:
  reference_lines:
    - { value: 0, label: "Brak wzrostu", color: subtext }
