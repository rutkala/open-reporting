# Mapa PKB na mieszkańca — 17 regionów NUTS2, 2024. Wzorzec geograficzny:
# zachód i metropolie ciemniejsze (wyższe PKB), ściana wschodnia jaśniejsza.
# Skala sekwencyjna Teal (poziom, nie zmiana) — ciemniejszy = wyższy.

type: choropleth
title:  "PKB na mieszkańca według regionów, 2024"
subtitle: "EUR na mieszkańca, ceny bieżące — 17 regionów NUTS2"
