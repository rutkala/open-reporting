# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# PKB nominalny w mld EUR — długa historia, Polska.
# Line: continuous level (stock concept) — trajectory is the message.

type: line
encoding:
  x: { dimension: date_key__cal_year }
  y: { metric: gdp_nominal }
filter:
  geo: PL
