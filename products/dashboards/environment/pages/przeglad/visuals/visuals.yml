# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visuals.schema.json
# Page 1 layout — environment scorecard:
#   Row 1: 4 KPI cards (GHG, renewables, municipal waste, water abstractions)
#   Row 2: line chart — GHG emissions trend (full width)
#   Row 3: line chart — renewable energy share trend (full width)
#
# 4 KPIs in one row is within Cowan 4±1 limit (exactly at capacity).
# Two full-width trend charts give the headline story above the fold.

rows:
  - title: "Kluczowe wskaźniki środowiskowe"
    items:
      - { visual: kpi_ghg_emissions,      width: "25%" }
      - { visual: kpi_renewable_energy,   width: "25%" }
      - { visual: kpi_municipal_waste,    width: "25%" }
      - { visual: kpi_water_abstractions, width: "25%" }
  - title: "Emisje gazów cieplarnianych — historia roczna"
    items:
      - { visual: trend_ghg_emissions, width: "100%" }
  - title: "Udział energii odnawialnej — historia roczna"
    items:
      - { visual: trend_renewable_energy, width: "100%" }
