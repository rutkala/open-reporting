# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Odpady komunalne na mieszkańca — najnowsza wartość z deltą r/r.
# ascending_is_good=false: spadek odpadów jest pożądany.

type: card
encoding:
  value: { metric: municipal_waste }
filter:
  geo: PL
options:
  delta:
    vs: prior_year
    format: icon-first
