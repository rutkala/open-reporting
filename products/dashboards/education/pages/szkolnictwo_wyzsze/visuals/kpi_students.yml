# yaml-language-server: $schema=https://open-reporting.dev/dbr/schemas/visual.schema.json
# Liczba studentów uczelni wyższych — bieżąca wartość z deltą r/r.
# ascending_is_good=true (framed as system capacity); however decline reflects demographics.

type: card
encoding:
  value: { metric: tertiary_enrolment }
filter:
  geo: PL
options:
  delta:
    vs: prior_year
    format: icon-first
