{% extends "base.html" %}

{% block header %}
<span>Otwarte Raporty</span>
{% endblock %}

{% block content %}
<div class="page-title">Domeny</div>
<div class="domain-list">
  {% for domain in domains %}
  <a href="/app/domeny/{{ domain.domain_id }}/" class="domain-card">
    <div class="domain-name">{{ domain.name_pl }}</div>
    <div class="domain-meta">
      <span>{{ domain.count }}</span>
      <span>wskaźnik{{ 'ów' if domain.count != 1 else '' }}</span>
      <span>›</span>
    </div>
  </a>
  {% endfor %}
</div>
{% endblock %}
