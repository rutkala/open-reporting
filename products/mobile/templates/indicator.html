{% extends "base.html" %}

{% block header %}
<a href="/app/domeny/{{ ind.domain_id }}/" class="back">‹</a>
<span style="font-size:13px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;">{{ ind.detail_name }}</span>
{% endblock %}

{% block content %}
<div class="detail-hero">
  <div>
    <span class="detail-hero-value">{{ ind.latest_value }}</span>
    {% if ind.detail_unit %}
    <span class="detail-hero-unit">{{ ind.detail_unit }}</span>
    {% endif %}
  </div>
  <div class="detail-hero-label">{{ ind.detail_name }}</div>
  <div class="detail-hero-period">{{ ind.latest_period }}</div>
</div>

<div class="chart-card">
  <div class="chart-title">Historia</div>
  <div style="position:relative;height:200px;">
    <canvas id="main-chart"></canvas>
  </div>
</div>

<script>
(function() {
  const labels = {{ ind.chart_labels | safe }};
  const values = {{ ind.chart_values | safe }};
  if (!values || values.length === 0) return;

  const ctx = document.getElementById('main-chart');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        data: values,
        borderColor: '#4A7FB5',
        borderWidth: 2,
        pointRadius: values.length <= 20 ? 3 : 0,
        pointBackgroundColor: '#4A7FB5',
        tension: 0.2,
        fill: true,
        backgroundColor: 'rgba(74,127,181,0.07)',
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (items) => labels[items[0].dataIndex],
            label: (item) => ' ' + item.parsed.y
          }
        }
      },
      scales: {
        x: {
          ticks: {
            maxTicksLimit: 6,
            font: { size: 10 },
            color: '#6B7A8D',
            maxRotation: 0,
          },
          grid: { color: '#DDE2E8' },
        },
        y: {
          ticks: { font: { size: 10 }, color: '#6B7A8D' },
          grid: { color: '#DDE2E8' },
        }
      }
    }
  });
})();
</script>
{% endblock %}
